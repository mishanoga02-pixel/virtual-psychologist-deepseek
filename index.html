<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClanChat — для своих</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #0a0e14; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        .app { max-width: 420px; width: 100%; background: #141a24; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.7); height: 92vh; display: flex; flex-direction: column; }
        /* AUTH */
        .auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 30px; gap: 14px; background: linear-gradient(145deg, #0e141e, #1a2230); }
        .auth-screen .logo { font-size: 3.5rem; color: #6faaff; }
        .auth-screen h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: 2px; color: #6faaff; }
        .auth-screen .sub { color: #8ab0d0; font-size: 0.9rem; margin-top: -10px; }
        .auth-screen input { width: 100%; padding: 14px 20px; border-radius: 40px; border: 1px solid #2a3a4a; background: #1e2836; color: #fff; font-size: 1rem; outline: none; }
        .auth-screen input:focus { border-color: #6faaff; }
        .auth-screen button { width: 100%; padding: 14px; border-radius: 40px; border: none; background: #6faaff; color: #0a0e14; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .auth-screen button:hover { transform: scale(1.02); background: #8abaff; }
        .auth-screen .toggle-auth { color: #8abaff; cursor: pointer; font-size: 0.9rem; }
        .auth-screen .toggle-auth:hover { text-decoration: underline; }
        .auth-screen .clan-tag { font-size: 0.8rem; color: #5a7a8a; margin-top: 10px; }

        /* CHAT */
        .chat-screen { display: none; flex-direction: column; height: 100%; }
        .chat-header { padding: 14px 18px; background: #1a2230; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3a4a; }
        .chat-header .user { display: flex; align-items: center; gap: 10px; }
        .chat-header .user .avatar { width: 40px; height: 40px; border-radius: 50%; background: #3d8a7a; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 1.1rem; }
        .chat-header .user .info { display: flex; flex-direction: column; }
        .chat-header .user .info .name { font-weight: 600; font-size: 1rem; }
        .chat-header .user .info .status { font-size: 0.65rem; opacity: 0.6; }
        .chat-header .actions { display: flex; gap: 14px; }
        .chat-header .actions i { font-size: 1.2rem; cursor: pointer; color: #8ab0d0; transition: 0.2s; }
        .chat-header .actions i:hover { color: #6faaff; }

        .messages { flex: 1; padding: 14px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; background: #0e141e; }
        .msg { max-width: 82%; padding: 9px 14px; border-radius: 18px; font-size: 0.9rem; word-break: break-word; animation: fadeIn 0.25s; }
        .msg.self { align-self: flex-end; background: #6faaff; color: #0a0e14; border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; background: #1e2836; border-bottom-left-radius: 4px; }
        .msg .time { font-size: 0.55rem; opacity: 0.5; display: block; margin-top: 3px; text-align: right; }
        .msg .file-icon { font-size: 2rem; display: block; }
        .msg .voice { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .msg .voice audio { height: 30px; max-width: 160px; }
        .msg .video-preview { max-width: 160px; border-radius: 12px; margin-top: 4px; }
        .msg .call-info { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .msg .call-info i { font-size: 1.2rem; }
        .msg.system { text-align: center; align-self: center; background: transparent; font-size: 0.7rem; opacity: 0.4; max-width: 90%; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .input-area { display: flex; gap: 6px; padding: 8px 12px 12px; background: #141a24; border-top: 1px solid #2a3a4a; align-items: center; flex-wrap: wrap; }
        .input-area input { flex: 1; padding: 10px 16px; border-radius: 40px; border: 1px solid #2a3a4a; background: #1e2836; color: #fff; outline: none; font-size: 0.9rem; min-width: 80px; }
        .input-area input:focus { border-color: #6faaff; }
        .input-area .btn-icon { background: transparent; border: none; color: #8ab0d0; font-size: 1.3rem; cursor: pointer; padding: 6px; transition: 0.2s; border-radius: 50%; }
        .input-area .btn-icon:hover { color: #6faaff; background: #1a2230; }
        .input-area .btn-send { background: #6faaff; border: none; border-radius: 40px; padding: 10px 18px; color: #0a0e14; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .input-area .btn-send:hover { transform: scale(1.02); background: #8abaff; }
        .recording-indicator { display: none; color: #ff6b6b; font-size: 0.75rem; align-items: center; gap: 6px; padding: 4px 12px; background: #2a1a1a; border-radius: 40px; }
        .recording-indicator .dot { width: 10px; height: 10px; background: #ff3b3b; border-radius: 50%; animation: pulse 0.6s infinite alternate; }
        @keyframes pulse { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }

        /* CALL MODAL */
        .call-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 999; justify-content: center; align-items: center; flex-direction: column; gap: 16px; }
        .call-modal.active { display: flex; }
        .call-modal .caller-name { font-size: 1.4rem; font-weight: 600; color: #fff; }
        .call-modal video { width: 85%; max-width: 400px; border-radius: 20px; background: #0a0e14; transform: scaleX(-1); }
        .call-modal .call-actions { display: flex; gap: 30px; margin-top: 10px; }
        .call-modal .call-actions button { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 1.6rem; cursor: pointer; transition: 0.2s; }
        .call-modal .call-actions .hangup { background: #ff3b3b; color: #fff; }
        .call-modal .call-actions .hangup:hover { transform: scale(1.1); }
        .call-modal .call-actions .mute { background: #2a3a4a; color: #fff; }
        .call-modal .call-actions .mute:hover { transform: scale(1.1); }
        .call-modal .call-actions .mute.muted { background: #ff3b3b; }

        @media (max-width: 480px) { .app { height: 96vh; border-radius: 16px; } .call-modal video { width: 90%; } }
    </style>
</head>
<body>

<div class="app" id="app">
    <!-- AUTH -->
    <div class="auth-screen" id="authScreen">
        <div class="logo"><i class="fas fa-shield-halved"></i></div>
        <h1>ClanChat</h1>
        <div class="sub">для своих</div>
        <input type="text" id="loginInput" placeholder="Твой ник (логин)" value="Аргум">
        <input type="password" id="passInput" placeholder="Пароль" value="123">
        <button id="authBtn">Войти в клан</button>
        <span class="toggle-auth" id="toggleAuth">Нет аккаунта? Создать</span>
        <div class="clan-tag">⚔️ только свои</div>
    </div>

    <!-- CHAT -->
    <div class="chat-screen" id="chatScreen">
        <div class="chat-header">
            <div class="user">
                <div class="avatar" id="myAvatar">A</div>
                <div class="info">
                    <span class="name" id="myUsername">Аргум</span>
                    <span class="status"><i class="fas fa-circle" style="color:#6fcf97; font-size:0.4rem;"></i> в клане</span>
                </div>
            </div>
            <div class="actions">
                <i class="fas fa-phone" id="voiceCallBtn" title="Голосовой звонок"></i>
                <i class="fas fa-video" id="videoCallBtn" title="Видеозвонок"></i>
                <i class="fas fa-user-plus" id="addContactBtn" title="Добавить контакт"></i>
                <i class="fas fa-sign-out-alt" id="logoutBtn" title="Выйти"></i>
            </div>
        </div>
        <div class="messages" id="messages">
            <div class="msg system">Добро пожаловать в ClanChat!</div>
        </div>
        <div class="input-area">
            <button class="btn-icon" id="attachBtn"><i class="fas fa-paperclip"></i></button>
            <button class="btn-icon" id="voiceMsgBtn"><i class="fas fa-microphone"></i></button>
            <button class="btn-icon" id="circleBtn"><i class="fas fa-circle"></i></button>
            <input type="text" id="msgInput" placeholder="Сообщение...">
            <button class="btn-send" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            <div class="recording-indicator" id="recordingIndicator">
                <span class="dot"></span> Запись...
            </div>
        </div>
    </div>
</div>

<!-- CALL MODAL -->
<div class="call-modal" id="callModal">
    <div class="caller-name" id="callerName">Звонок...</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted style="width:100px; position:absolute; bottom:100px; right:20px; border-radius:16px; transform:scaleX(-1);"></video>
    <div class="call-actions">
        <button class="mute" id="muteBtn"><i class="fas fa-microphone"></i></button>
        <button class="hangup" id="hangupBtn"><i class="fas fa-phone-slash"></i></button>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script>
    (function() {
        // === DOM ===
        const authScreen = document.getElementById('authScreen');
        const chatScreen = document.getElementById('chatScreen');
        const loginInput = document.getElementById('loginInput');
        const passInput = document.getElementById('passInput');
        const authBtn = document.getElementById('authBtn');
        const toggleAuth = document.getElementById('toggleAuth');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesDiv = document.getElementById('messages');
        const myUsername = document.getElementById('myUsername');
        const myAvatar = document.getElementById('myAvatar');
        const logoutBtn = document.getElementById('logoutBtn');
        const voiceCallBtn = document.getElementById('voiceCallBtn');
        const videoCallBtn = document.getElementById('videoCallBtn');
        const addContactBtn = document.getElementById('addContactBtn');
        const voiceMsgBtn = document.getElementById('voiceMsgBtn');
        const circleBtn = document.getElementById('circleBtn');
        const attachBtn = document.getElementById('attachBtn');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const callModal = document.getElementById('callModal');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const muteBtn = document.getElementById('muteBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const callerName = document.getElementById('callerName');

        // === STATE ===
        let currentUser = null;
        let isRegister = false;
        let peer = null;
        let currentCall = null;
        let localStream = null;
        let isMuted = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let contacts = [];
        let activeContact = null; // для упрощения — все сообщения в общий чат

        // === FAKE DB (localStorage) ===
        function getUsers() {
            return JSON.parse(localStorage.getItem('clanchat_users') || '{}');
        }
        function saveUsers(users) {
            localStorage.setItem('clanchat_users', JSON.stringify(users));
        }
        function getMessages() {
            return JSON.parse(localStorage.getItem('clanchat_messages') || '[]');
        }
        function saveMessages(msgs) {
            localStorage.setItem('clanchat_messages', JSON.stringify(msgs));
        }
        function getContacts() {
            return JSON.parse(localStorage.getItem('clanchat_contacts') || '[]');
        }
        function saveContacts(c) {
            localStorage.setItem('clanchat_contacts', JSON.stringify(c));
        }

        // === AUTH ===
        function authUser() {
            const login = loginInput.value.trim();
            const pass = passInput.value.trim();
            if (!login || !pass) { alert('Введи логин и пароль'); return; }

            const users = getUsers();
            if (isRegister) {
                if (users[login]) { alert('Такой ник уже занят'); return; }
                users[login] = { password: pass, name: login };
                saveUsers(users);
                alert('Аккаунт создан! Войди.');
                isRegister = false;
                toggleAuth.textContent = 'Нет аккаунта? Создать';
                authBtn.textContent = 'Войти в клан';
                return;
            }

            if (!users[login] || users[login].password !== pass) {
                alert('Неверный логин или пароль');
                return;
            }

            currentUser = login;
            startChat();
        }

        function startChat() {
            authScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            myUsername.textContent = currentUser;
            myAvatar.textContent = currentUser[0].toUpperCase();
            contacts = getContacts();
            loadMessages();
            initPeer();
            addSystemMessage('⚔️ Ты в клане. Пиши своим.');
        }

        function logout() {
            if (peer) peer.destroy();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            currentUser = null;
            chatScreen.style.display = 'none';
            authScreen.style.display = 'flex';
            messagesDiv.innerHTML = '';
            document.title = 'ClanChat';
        }

        // === PEERJS ===
        function initPeer() {
            peer = new Peer(currentUser, {
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                console.log('Peer открыт:', id);
                addSystemMessage('🔗 Подключение установлено. Твой ID: ' + id);
            });

            peer.on('call', (call) => {
                const isVideo = call.metadata && call.metadata.type === 'video';
                navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo })
                    .then(stream => {
                        localStream = stream;
                        localVideo.srcObject = stream;
                        call.answer(stream);
                        currentCall = call;
                        callerName.textContent = call.metadata?.caller || 'Собеседник';
                        callModal.classList.add('active');
                        call.on('stream', (remoteStream) => {
                            remoteVideo.srcObject = remoteStream;
                        });
                        call.on('close', () => endCall());
                        addSystemMessage('📞 Входящий звонок от ' + (call.metadata?.caller || 'неизвестного'));
                    })
                    .catch(() => { alert('Ошибка доступа к медиа'); });
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                if (err.type === 'peer-unavailable') {
                    alert('Пользователь не в сети');
                }
            });
        }

        // === MESSAGES ===
        function addMessage(text, sender, type = 'text', extra = null) {
            const msgs = getMessages();
            msgs.push({ text, sender, type, extra, time: Date.now() });
            saveMessages(msgs);
            renderMessage({ text, sender, type, extra, time: Date.now() });
            // уведомление
            if (sender !== currentUser && Notification.permission === 'granted') {
                new Notification('ClanChat: ' + sender, { body: text });
            }
        }

        function renderMessage(msg) {
            const div = document.createElement('div');
            const isSelf = msg.sender === currentUser;
            div.className = `msg ${isSelf ? 'self' : 'other'}`;
            let content = msg.text;
            if (msg.type === 'voice') {
                content = `<div class="voice"><i class="fas fa-microphone"></i> <audio controls src="${msg.extra}"></audio></div>`;
            } else if (msg.type === 'circle') {
                content = `<video class="video-preview" src="${msg.extra}" controls autoplay muted loop></video>`;
            } else if (msg.type === 'file') {
                content = `<a href="${msg.extra}" target="_blank" style="color:${isSelf ? '#0a0e14' : '#6faaff'};"><i class="fas fa-file"></i> Файл</a>`;
            } else if (msg.type === 'call') {
                content = `<div class="call-info"><i class="fas fa-phone"></i> ${msg.text}</div>`;
            }
            const time = new Date(msg.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `${content}<span class="time">${time}</span>`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function loadMessages() {
            messagesDiv.innerHTML = '';
            const msgs = getMessages();
            msgs.forEach(m => renderMessage(m));
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg system';
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // === SEND TEXT ===
        function sendText() {
            const text = msgInput.value.trim();
            if (!text) return;
            addMessage(text, currentUser);
            msgInput.value = '';
            // Отправляем всем контактам (имитация, реально — через PeerJS)
            contacts.forEach(contact => {
                // В реальном проекте — отправка через WebSocket/Peer
            });
        }

        // === VOICE RECORDING ===
        function startVoiceRecording() {
            if (isRecording) return;
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    isRecording = true;
                    recordingIndicator.style.display = 'flex';
                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/ogg' });
                        const url = URL.createObjectURL(blob);
                        addMessage('🎤 Голосовое', currentUser, 'voice', url);
                        stream.getTracks().forEach(t => t.stop());
                        recordingIndicator.style.display = 'none';
                        isRecording = false;
                    };
                    mediaRecorder.start();
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                    }, 10000);
                })
                .catch(() => alert('Нет доступа к микрофону'));
        }

        // === CIRCLE ===
        function startCircleRecording() {
            if (isRecording) return;
            navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: 'user', width: { ideal: 240 }, height: { ideal: 240 } } })
                .then(stream => {
                    isRecording = true;
                    recordingIndicator.style.display = 'flex';
                    recordingIndicator.innerHTML = '<span class="dot"></span> Кружочек...';
                    const chunks = [];
                    const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
                    rec.ondataavailable = e => chunks.push(e.data);
                    rec.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        addMessage('📹 Кружочек', currentUser, 'circle', url);
                        stream.getTracks().forEach(t => t.stop());
                        recordingIndicator.style.display = 'none';
                        recordingIndicator.innerHTML = '<span class="dot"></span> Запись...';
                        isRecording = false;
                    };
                    rec.start();
                    setTimeout(() => {
                        if (rec && rec.state === 'recording') rec.stop();
                    }, 7000);
                })
                .catch(() => alert('Нет доступа к камере'));
        }

        // === CALLS ===
        function startCall(isVideo) {
            if (!peer) { alert('Подожди подключения...'); return; }
            const target = prompt('Введите ник собеседника:');
            if (!target) return;
            if (target === currentUser) { alert('Нельзя позвонить самому себе'); return; }
            navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo })
                .then(stream => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    const call = peer.call(target, stream, { metadata: { type: isVideo ? 'video' : 'audio', caller: currentUser } });
                    if (!call) { alert('Пользователь не найден'); return; }
                    currentCall = call;
                    callerName.textContent = target;
                    callModal.classList.add('active');
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                    });
                    call.on('close', () => endCall());
                    addMessage('📞 Звонок ' + target + (isVideo ? ' (видео)' : ''), currentUser, 'call');
                })
                .catch(() => alert('Ошибка доступа к медиа'));
        }

        function endCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (currentCall) currentCall.close();
            currentCall = null;
            localStream = null;
            callModal.classList.remove('active');
            remoteVideo.srcObject = null;
            localVideo.srcObject = null;
            isMuted = false;
            muteBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            muteBtn.classList.remove('muted');
        }

        // === CONTACTS ===
        function addContact() {
            const name = prompt('Введите ник для добавления в контакты:');
            if (!name) return;
            const users = getUsers();
            if (!users[name]) { alert('Пользователь не найден в клане'); return; }
            if (contacts.includes(name)) { alert('Уже в контактах'); return; }
            contacts.push(name);
            saveContacts(contacts);
            addSystemMessage('➕ ' + name + ' добавлен в контакты');
        }

        // === EVENTS ===
        authBtn.addEventListener('click', authUser);
        toggleAuth.addEventListener('click', () => {
            isRegister = !isRegister;
            authBtn.textContent = isRegister ? 'Создать аккаунт' : 'Войти в клан';
            toggleAuth.textContent = isRegister ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Создать';
        });
        sendBtn.addEventListener('click', sendText);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendText(); });
        logoutBtn.addEventListener('click', logout);
        addContactBtn.addEventListener('click', addContact);

        voiceCallBtn.addEventListener('click', () => startCall(false));
        videoCallBtn.addEventListener('click', () => startCall(true));
        hangupBtn.addEventListener('click', endCall);

        muteBtn.addEventListener('click', () => {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
                muteBtn.innerHTML = isMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
                muteBtn.classList.toggle('muted');
            }
        });

        voiceMsgBtn.addEventListener('click', startVoiceRecording);
        circleBtn.addEventListener('click', startCircleRecording);

        attachBtn.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const dataUrl = ev.target.result;
                        addMessage('📎 ' + file.name, currentUser, 'file', dataUrl);
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        });

        // === INIT ===
        window.addEventListener('DOMContentLoaded', () => {
            const users = getUsers();
            if (!users['Аргум']) {
                users['Аргум'] = { password: '123', name: 'Аргум' };
                saveUsers(users);
            }
            loginInput.value = 'Аргум';
            passInput.value = '123';

            if (Notification.permission === 'default') {
                Notification.requestPermission();
            }
        });

        // === ВСТРОЕННЫЙ ПОМОЩНИК ДЛЯ ЗВОНКОВ ===
