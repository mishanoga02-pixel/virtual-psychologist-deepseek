<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClanChat — для своих</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #141a24;
            --bg-card: #1a2230;
            --bg-input: #1e2836;
            --bg-msg-self: #6faaff;
            --bg-msg-other: #1e2836;
            --text-primary: #e0e0e0;
            --text-secondary: #8ab0d0;
            --text-accent: #6faaff;
            --border-color: #2a3a4a;
            --shadow: 0 20px 60px rgba(0,0,0,0.7);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        .app {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 800px;
            background: var(--bg-secondary);
            border-radius: 0;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 30px 24px;
            gap: 12px;
            background: linear-gradient(160deg, #0e141e 0%, #1a2230 100%);
            text-align: center;
        }
        .auth-screen .logo-wrap {
            width: 80px;
            height: 80px;
            background: var(--text-accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: var(--bg-primary);
            margin-bottom: 4px;
            box-shadow: 0 8px 30px rgba(111, 170, 255, 0.25);
        }
        .auth-screen h1 { font-size: 2.4rem; font-weight: 800; color: var(--text-accent); }
        .auth-screen .sub { color: var(--text-secondary); font-size: 0.95rem; margin-top: -6px; }
        .auth-screen input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 50px;
            border: 1.5px solid var(--border-color);
            background: var(--bg-input);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            margin-top: 4px;
        }
        .auth-screen input:focus { border-color: var(--text-accent); box-shadow: 0 0 0 3px rgba(111, 170, 255, 0.15); }
        .auth-screen button {
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            border: none;
            background: var(--text-accent);
            color: var(--bg-primary);
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 4px;
        }
        .auth-screen button:hover { transform: scale(1.02); background: #8abaff; }
        .auth-screen .toggle-auth {
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 6px 0;
            transition: var(--transition);
        }
        .auth-screen .toggle-auth:hover { color: var(--text-accent); }
        .main-layout { display: none; flex: 1; overflow: hidden; }
        .main-layout.active { display: flex; }
        .left-panel {
            width: 100%;
            max-width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .left-panel .panel-header {
            padding: 12px 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 60px;
        }
        .left-panel .panel-header .user-info { display: flex; align-items: center; gap: 10px; }
        .left-panel .panel-header .user-info .avatar {
            width: 36px; height: 36px; border-radius: 50%; background: var(--text-accent);
            display: flex; align-items: center; justify-content: center; font-weight: 700;
            color: var(--bg-primary); font-size: 0.9rem; flex-shrink: 0;
        }
        .left-panel .panel-header .user-info .name { font-weight: 600; font-size: 0.95rem; }
        .left-panel .panel-header .actions { display: flex; gap: 8px; }
        .left-panel .panel-header .actions i {
            font-size: 1.1rem; cursor: pointer; color: var(--text-secondary);
            transition: var(--transition); padding: 6px; border-radius: 50%;
        }
        .left-panel .panel-header .actions i:hover { color: var(--text-accent); background: rgba(111, 170, 255, 0.08); }
        .chat-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
        .chat-list::-webkit-scrollbar { width: 4px; }
        .chat-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .chat-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px;
            border-radius: var(--radius); cursor: pointer; transition: var(--transition); margin-bottom: 2px;
        }
        .chat-item:hover { background: var(--bg-card); }
        .chat-item.active { background: var(--bg-card); border: 1px solid var(--text-accent); }
        .chat-item .chat-avatar {
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-weight: 700; font-size: 1rem; flex-shrink: 0; color: #fff;
        }
        .chat-item .chat-info { flex: 1; min-width: 0; }
        .chat-item .chat-info .chat-name { font-weight: 600; font-size: 0.9rem; }
        .chat-item .chat-info .chat-last {
            font-size: 0.75rem; color: var(--text-secondary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-item .chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
        .chat-item .chat-meta .time { font-size: 0.6rem; color: var(--text-secondary); }
        .chat-item .chat-meta .unread {
            background: var(--text-accent); color: var(--bg-primary); font-size: 0.6rem;
            font-weight: 700; padding: 2px 8px; border-radius: 30px; min-width: 18px; text-align: center;
        }
        .right-panel { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); min-width: 0; }
        .right-panel .chat-header {
            padding: 10px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; min-height: 60px; flex-shrink: 0;
        }
        .right-panel .chat-header .chat-title { display: flex; align-items: center; gap: 10px; }
        .right-panel .chat-header .chat-title .avatar {
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-weight: 700; font-size: 0.9rem; color: #fff;
        }
        .right-panel .chat-header .chat-title .name { font-weight: 600; font-size: 0.95rem; }
        .right-panel .chat-header .chat-title .members { font-size: 0.65rem; color: var(--text-secondary); }
        .right-panel .chat-header .actions { display: flex; gap: 10px; }
        .right-panel .chat-header .actions i {
            font-size: 1.1rem; cursor: pointer; color: var(--text-secondary);
            transition: var(--transition); padding: 6px; border-radius: 50%;
        }
        .right-panel .chat-header .actions i:hover { color: var(--text-accent); background: rgba(111, 170, 255, 0.08); }
        .messages { flex: 1; padding: 16px 14px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth; }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .msg {
            max-width: 75%; padding: 10px 16px; border-radius: 18px; font-size: 0.9rem;
            line-height: 1.45; word-break: break-word; animation: fadeIn 0.25s ease;
        }
        .msg.self { align-self: flex-end; background: var(--bg-msg-self); color: var(--bg-primary); border-bottom-right-radius: 4px; }
        .msg.other { align-self: flex-start; background: var(--bg-msg-other); border-bottom-left-radius: 4px; }
        .msg.system { align-self: center; background: transparent; color: var(--text-secondary); font-size: 0.7rem; padding: 4px 12px; }
        .msg .time { font-size: 0.55rem; opacity: 0.5; display: block; margin-top: 4px; text-align: right; }
        .msg .voice { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .msg .voice audio { height: 32px; max-width: 170px; border-radius: 20px; background: rgba(255,255,255,0.05); }
        .msg .video-preview { max-width: 170px; border-radius: 14px; margin-top: 4px; border: 1px solid var(--border-color); }
        .msg .file-link {
            display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 30px;
            background: rgba(255,255,255,0.06); text-decoration: none; color: var(--text-accent); font-weight: 500;
            transition: var(--transition);
        }
        .msg.self .file-link { color: var(--bg-primary); background: rgba(0,0,0,0.08); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .input-area {
            display: flex; gap: 6px; padding: 8px 12px 14px; background: var(--bg-secondary);
            border-top: 1px solid var(--border-color); align-items: center; flex-wrap: wrap; flex-shrink: 0;
        }
        .input-area input {
            flex: 1; padding: 10px 16px; border-radius: 50px; border: 1.5px solid var(--border-color);
            background: var(--bg-input); color: #fff; outline: none; font-size: 0.9rem; min-width: 60px; transition: var(--transition);
        }
        .input-area input:focus { border-color: var(--text-accent); box-shadow: 0 0 0 3px rgba(111, 170, 255, 0.08); }
        .input-area .btn-icon {
            background: transparent; border: none; color: var(--text-secondary); font-size: 1.2rem;
            cursor: pointer; padding: 6px; border-radius: 50%; transition: var(--transition);
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
        }
        .input-area .btn-icon:hover { color: var(--text-accent); background: rgba(111, 170, 255, 0.06); }
        .input-area .btn-send {
            background: var(--text-accent); border: none; border-radius: 50px; padding: 10px 18px;
            color: var(--bg-primary); font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; gap: 6px;
        }
        .input-area .btn-send:hover { transform: scale(1.02); background: #8abaff; }
        .recording-indicator {
            display: none; color: #ff6b6b; font-size: 0.7rem; align-items: center; gap: 6px;
            padding: 4px 14px; background: #2a1a1a; border-radius: 50px; border: 1px solid #ff3b3b33; flex-shrink: 0;
        }
        .recording-indicator .dot { width: 10px; height: 10px; background: #ff3b3b; border-radius: 50%; animation: pulse 0.6s infinite alternate; }
        @keyframes pulse { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }
        .call-modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); z-index: 999;
            justify-content: center; align-items: center; flex-direction: column; gap: 16px; padding: 20px;
        }
        .call-modal.active { display: flex; }
        .call-modal .caller-name { font-size: 1.4rem; font-weight: 600; color: #fff; }
        .call-modal .caller-status { font-size: 0.85rem; color: var(--text-secondary); }
        .call-modal video { width: 85%; max-width: 400px; border-radius: 20px; background: #0a0e14; transform: scaleX(-1); border: 1px solid var(--border-color); }
        .call-modal .local-video-wrap {
            position: absolute; bottom: 100px; right: 16px; width: 80px; height: 110px;
            border-radius: 14px; overflow: hidden; border: 2px solid var(--border-color); background: #0a0e14;
        }
        .call-modal .local-video-wrap video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .call-modal .call-actions { display: flex; gap: 30px; }
        .call-modal .call-actions button {
            width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 1.5rem;
            cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center;
        }
        .call-modal .call-actions .hangup { background: #ff3b3b; color: #fff; }
        .call-modal .call-actions .hangup:hover { background: #ff5555; transform: scale(1.05); }
        .call-modal .call-actions .mute { background: var(--bg-card); color: #fff; border: 1px solid var(--border-color); }
        .call-modal .call-actions .mute.muted { background: #ff3b3b; border-color: #ff3b3b; }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 1000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--bg-secondary); border-radius: var(--radius); padding: 24px;
            max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        .modal-box h3 { margin-bottom: 12px; font-size: 1.1rem; }
        .modal-box .modal-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px;
            border-radius: var(--radius); cursor: pointer; transition: var(--transition); margin-bottom: 4px;
        }
        .modal-box .modal-item:hover { background: var(--bg-card); }
        .modal-box .modal-item .avatar {
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-weight: 700; font-size: 0.8rem; color: #fff;
        }
        .modal-box .modal-item .name { font-weight: 500; font-size: 0.9rem; }
        .modal-box .modal-item .check { margin-left: auto; color: var(--text-accent); font-size: 1.1rem; }
        .modal-box .modal-actions { display: flex; gap: 10px; margin-top: 12px; justify-content: flex-end; }
        .modal-box .modal-actions button { padding: 10px 24px; border-radius: 50px; border: none; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .modal-box .modal-actions .btn-primary { background: var(--text-accent); color: var(--bg-primary); }
        .modal-box .modal-actions .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); }
        .modal-box .modal-actions button:hover { transform: scale(1.02); }
        .back-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 1.2rem; cursor: pointer; padding: 4px 8px; }
        .back-btn:hover { color: var(--text-accent); }

        @media (max-width: 640px) {
            .left-panel { max-width: 100%; border-right: none; }
            .right-panel { display: none; }
            .right-panel.active-mobile { display: flex; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg-primary); }
            .app { max-height: 100vh; border-radius: 0; }
            .auth-screen h1 { font-size: 2rem; }
            .chat-item { padding: 8px 10px; }
            .chat-item .chat-avatar { width: 38px; height: 38px; font-size: 0.8rem; }
            .msg { max-width: 88%; font-size: 0.85rem; padding: 8px 12px; }
            .input-area { padding: 6px 10px 12px; }
            .input-area input { font-size: 0.85rem; padding: 8px 14px; }
        }
        @media (min-width: 641px) {
            .right-panel { display: flex !important; }
            .right-panel .chat-header .back-btn { display: none !important; }
            .left-panel .panel-header .back-btn { display: none !important; }
            .app { border-radius: var(--radius); height: 92vh; }
            body { padding: 20px; background: #05080c; }
        }
        @media (max-width: 480px) {
            .call-modal video { width: 92%; }
            .call-modal .local-video-wrap { width: 60px; height: 85px; bottom: 80px; right: 10px; }
            .call-modal .call-actions button { width: 50px; height: 50px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="auth-screen" id="authScreen">
        <div class="logo-wrap"><i class="fas fa-shield-halved"></i></div>
        <h1>ClanChat</h1>
        <div class="sub">для своих</div>
        <input type="text" id="loginInput" placeholder="Твой ник" value="Аргум">
        <input type="password" id="passInput" placeholder="Пароль" value="123">
        <button id="authBtn">Войти</button>
        <span class="toggle-auth" id="toggleAuth">Нет аккаунта? Создать</span>
    </div>
    <div class="main-layout" id="mainLayout">
        <div class="left-panel" id="leftPanel">
            <div class="panel-header">
                <div class="user-info">
                    <div class="avatar" id="myAvatar">A</div>
                    <span class="name" id="myUsername">Аргум</span>
                </div>
                <div class="actions">
                    <i class="fas fa-user-plus" id="addContactBtn" title="Добавить контакт"></i>
                    <i class="fas fa-users" id="createGroupBtn" title="Создать группу"></i>
                    <i class="fas fa-sign-out-alt" id="logoutBtn" title="Выйти"></i>
                </div>
            </div>
            <div class="chat-list" id="chatList"></div>
        </div>
        <div class="right-panel" id="rightPanel">
            <div class="chat-header">
                <div class="chat-title">
                    <button class="back-btn" id="backToListBtn"><i class="fas fa-arrow-left"></i></button>
                    <div class="avatar" id="chatAvatar" style="background:#3d8a7a;">👥</div>
                    <div>
                        <div class="name" id="chatTitleName">Общий</div>
                        <div class="members" id="chatMembers">0 участников</div>
                    </div>
                </div>
                <div class="actions">
                    <i class="fas fa-phone" id="voiceCallBtn" title="Звонок"></i>
                    <i class="fas fa-video" id="videoCallBtn" title="Видеозвонок"></i>
                    <i class="fas fa-user-plus" id="addToGroupBtn" title="Добавить в группу"></i>
                </div>
            </div>
            <div class="messages" id="messages"><div class="msg system">Выберите чат слева</div></div>
            <div class="input-area" id="inputArea">
                <button class="btn-icon" id="attachBtn"><i class="fas fa-paperclip"></i></button>
                <button class="btn-icon" id="voiceMsgBtn"><i class="fas fa-microphone"></i></button>
                <button class="btn-icon" id="circleBtn"><i class="fas fa-circle"></i></button>
                <input type="text" id="msgInput" placeholder="Сообщение...">
                <button class="btn-send" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                <div class="recording-indicator" id="recordingIndicator"><span class="dot"></span> Запись...</div>
            </div>
        </div>
    </div>
</div>
<div class="call-modal" id="callModal">
    <div class="caller-name" id="callerName">Звонок...</div>
    <div class="caller-status" id="callerStatus">подключение...</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="local-video-wrap"><video id="localVideo" autoplay playsinline muted></video></div>
    <div class="call-actions">
        <button class="mute" id="muteBtn"><i class="fas fa-microphone"></i></button>
        <button class="hangup" id="hangupBtn"><i class="fas fa-phone-slash"></i></button>
    </div>
</div>
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h3 id="modalTitle">Выберите участников</h3>
        <div id="modalList"></div>
        <div class="modal-actions">
            <button class="btn-secondary" id="modalCancelBtn">Отмена</button>
            <button class="btn-primary" id="modalConfirmBtn">Готово</button>
        </div>
    </div>
</div>
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script>
    (function() {
        // ===== БЭКЕНД =====
        const API_URL = 'https://clanchat-backend.onrender.com/api';

        // ===== DOM =====
        const authScreen = document.getElementById('authScreen');
        const mainLayout = document.getElementById('mainLayout');
        const loginInput = document.getElementById('loginInput');
        const passInput = document.getElementById('passInput');
        const authBtn = document.getElementById('authBtn');
        const toggleAuth = document.getElementById('toggleAuth');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesDiv = document.getElementById('messages');
        const chatList = document.getElementById('chatList');
        const rightPanel = document.getElementById('rightPanel');
        const myUsername = document.getElementById('myUsername');
        const myAvatar = document.getElementById('myAvatar');
        const chatTitleName = document.getElementById('chatTitleName');
        const chatMembers = document.getElementById('chatMembers');
        const chatAvatar = document.getElementById('chatAvatar');
        const logoutBtn = document.getElementById('logoutBtn');
        const voiceCallBtn = document.getElementById('voiceCallBtn');
        const videoCallBtn = document.getElementById('videoCallBtn');
        const addContactBtn = document.getElementById('addContactBtn');
        const addToGroupBtn = document.getElementById('addToGroupBtn');
        const createGroupBtn = document.getElementById('createGroupBtn');
        const backToListBtn = document.getElementById('backToListBtn');
        const voiceMsgBtn = document.getElementById('voiceMsgBtn');
        const circleBtn = document.getElementById('circleBtn');
        const attachBtn = document.getElementById('attachBtn');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const callModal = document.getElementById('callModal');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const muteBtn = document.getElementById('muteBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const callerName = document.getElementById('callerName');
        const callerStatus = document.getElementById('callerStatus');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalList = document.getElementById('modalList');
        const modalTitle = document.getElementById('modalTitle');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');

        // ===== STATE =====
        let currentUser = null;
        let isRegister = false;
        let peer = null;
        let currentCall = null;
        let localStream = null;
        let isMuted = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let contacts = [];
        let chats = [];
        let currentChatId = null;
        let modalResolve = null;
        let allUsers = [];

        // ===== API =====
        async function apiRequest(endpoint, method = 'GET', body = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            try {
                const response = await fetch(`${API_URL}${endpoint}`, options);
                return await response.json();
            } catch (e) {
                console.error('API Error:', e);
                return { error: 'Ошибка соединения с сервером' };
            }
        }

        // ===== AUTH =====
        async function authUser() {
            const login = loginInput.value.trim();
            const pass = passInput.value.trim();
            if (!login || !pass) { alert('Введи логин и пароль'); return; }
            if (isRegister) {
                const result = await apiRequest('/register', 'POST', { username: login, password: pass });
                if (result.error) { alert(result.error); return; }
                alert('Аккаунт создан! Войди.');
                isRegister = false;
                toggleAuth.textContent = 'Нет аккаунта? Создать';
                authBtn.textContent = 'Войти';
                return;
            }
            const result = await apiRequest('/login', 'POST', { username: login, password: pass });
            if (result.error) { alert(result.error); return; }
            currentUser = login;
            startChat();
        }

        function startChat() {
            authScreen.style.display = 'none';
            mainLayout.classList.add('active');
            myUsername.textContent = currentUser;
            myAvatar.textContent = currentUser[0].toUpperCase();
            loadData();
            initPeer();
            setupResponsive();
        }

        async function loadData() {
            const usersResult = await apiRequest('/users');
            if (!usersResult.error) allUsers = usersResult;
            const contactsResult = await apiRequest('/contacts/' + currentUser);
            if (!contactsResult.error) contacts = contactsResult;
            const chatsResult = await apiRequest('/chats/' + currentUser);
            if (!chatsResult.error) {
                chats = chatsResult;
                if (chats.length === 0) {
                    const newChat = await apiRequest('/chats', 'POST', {
                        name: 'Общий',
                        type: 'group',
                        members: [currentUser],
                        created_by: currentUser
                    });
                    if (!newChat.error) chats = [newChat.chat];
                }
                renderChatList();
                if (chats.length > 0 && !currentChatId) {
                    openChat(chats[0].id);
                }
            }
        }

        // ===== PEER =====
        function initPeer() {
            peer = new Peer(currentUser, {
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
            });
            peer.on('open', (id) => console.log('Peer открыт:', id));
            peer.on('call', (call) => {
                const isVideo = call.metadata && call.metadata.type === 'video';
                navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo })
                    .then(stream => {
                        localStream = stream;
                        localVideo.srcObject = stream;
                        call.answer(stream);
                        currentCall = call;
                        callerName.textContent = call.metadata?.caller || 'Собеседник';
                        callerStatus.textContent = 'в разговоре';
                        callModal.classList.add('active');
                        call.on('stream', (s) => { remoteVideo.srcObject = s; });
                        call.on('close', () => endCall());
                    })
                    .catch(() => alert('Ошибка доступа к медиа'));
            });
            peer.on('error', (err) => {
                console.error('Peer error:', err);
                if (err.type === 'peer-unavailable') alert('Пользователь не в сети');
            });
        }

        // ===== CHATS =====
        function renderChatList() {
            chatList.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
                const avatar = chat.type === 'group' ? '👥' : chat.name[0].toUpperCase();
                const color = chat.type === 'group' ? '#8a6a4a' : '#3d8a7a';
                div.innerHTML = `
                    <div class="chat-avatar" style="background:${color}">${avatar}</div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name}</div>
                        <div class="chat-last">${chat.last_message || 'Нет сообщений'}</div>
                    </div>
                    <div class="chat-meta">
                        <span class="time">${chat.last_time || ''}</span>
                        ${chat.unread > 0 ? `<span class="unread">${chat.unread}</span>` : ''}
                    </div>
                `;
                div.addEventListener('click', () => openChat(chat.id));
                chatList.appendChild(div);
            });
        }

        async function openChat(chatId) {
            currentChatId = chatId;
            renderChatList();
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            chatTitleName.textContent = chat.name;
            chatMembers.textContent = chat.type === 'group' ? (chat.members?.length || 0) + ' участников' : 'личный чат';
            chatAvatar.textContent = chat.type === 'group' ? '👥' : chat.name[0].toUpperCase();
            chatAvatar.style.background = chat.type === 'group' ? '#8a6a4a' : '#3d8a7a';
            const msgsResult = await apiRequest('/messages/' + chatId);
            if (!msgsResult.error) {
                messagesDiv.innerHTML = '';
                if (msgsResult.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'msg system';
                    empty.textContent = 'Нет сообщений. Напишите что-нибудь!';
                    messagesDiv.appendChild(empty);
                } else {
                    msgsResult.forEach(m => renderMessage(m));
                }
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
            if (window.innerWidth <= 640) rightPanel.classList.add('active-mobile');
        }

        function renderMessage(msg) {
            const div = document.createElement('div');
            if (msg.sender === 'system') {
                div.className = 'msg system';
                div.textContent = msg.text;
                messagesDiv.appendChild(div);
                return;
            }
            const isSelf = msg.sender === currentUser;
            div.className = `msg ${isSelf ? 'self' : 'other'}`;
            let content = msg.text;
            if (msg.type === 'voice') {
                content = `<div class="voice"><i class="fas fa-microphone"></i> <audio controls src="${msg.extra}"></audio></div>`;
            } else if (msg.type === 'circle') {
                content = `<video class="video-preview" src="${msg.extra}" controls autoplay muted loop playsinline></video>`;
            } else if (msg.type === 'file') {
                content = `<a href="${msg.extra}" target="_blank" class="file-link"><i class="fas fa-file"></i> ${msg.text}</a>`;
            }
            const time = new Date(msg.created_at || msg.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `${content}<span class="time">${time}</span>`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ===== SEND =====
        async function sendText() {
            const text = msgInput.value.trim();
            if (!text || !currentChatId) return;
            const result = await apiRequest('/messages', 'POST', {
                chat_id: currentChatId,
                sender: currentUser,
                text: text,
                type: 'text'
            });
            if (!result.error) {
                msgInput.value = '';
                openChat(currentChatId);
            }
        }

        // ===== VOICE & CIRCLE =====
        function startVoiceRecording() {
            if (isRecording || !currentChatId) return;
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    isRecording = true;
                    recordingIndicator.style.display = 'flex';
                    recordingIndicator.innerHTML = '<span class="dot"></span> Голосовое...';
                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/ogg' });
                        const url = URL.createObjectURL(blob);
                        await apiRequest('/messages', 'POST', {
                            chat_id: currentChatId,
                            sender: currentUser,
                            text: '🎤 Голосовое',
                            type: 'voice',
                            extra: url
                        });
                        stream.getTracks().forEach(t => t.stop());
                        recordingIndicator.style.display = 'none';
                        isRecording = false;
                        openChat(currentChatId);
                    };
                    mediaRecorder.start();
                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                    }, 15000);
                })
                .catch(() => alert('Нет доступа к микрофону'));
        }

        function startCircleRecording() {
            if (isRecording || !currentChatId) return;
            navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: 'user', width: { ideal: 240 }, height: { ideal: 240 } } })
                .then(stream => {
                    isRecording = true;
                    recordingIndicator.style.display = 'flex';
                    recordingIndicator.innerHTML = '<span class="dot"></span> Кружочек...';
                    const chunks = [];
                    const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
                    rec.ondataavailable = e => chunks.push(e.data);
                    rec.onstop = async () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        await apiRequest('/messages', 'POST', {
                            chat_id: currentChatId,
                            sender: currentUser,
                            text: '📹 Кружочек',
                            type: 'circle',
                            extra: url
                        });
                        stream.getTracks().forEach(t => t.stop());
                        recordingIndicator.style.display = 'none';
                        isRecording = false;
                        openChat(currentChatId);
                    };
                    rec.start();
                    setTimeout(() => {
                        if (rec && rec.state === 'recording') rec.stop();
                    }, 7000);
                })
                .catch(() => alert('Нет доступа к камере'));
        }

        // ===== CALLS =====
        function startCall(isVideo) {
            if (!peer) { alert('Подожди подключения...'); return; }
            const target = prompt('Введите ник собеседника:');
            if (!target || target === currentUser) return;
            navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo })
                .then(stream => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                    const call = peer.call(target, stream, { metadata: { type: isVideo ? 'video' : 'audio', caller: currentUser } });
                    if (!call) { alert('Пользователь не найден'); return; }
                    currentCall = call;
                    callerName.textContent = target;
                    callerStatus.textContent = 'соединение...';
                    callModal.classList.add('active');
                    call.on('stream', (s) => { remoteVideo.srcObject = s; callerStatus.textContent = 'в разговоре'; });
                    call.on('close', () => endCall());
                    apiRequest('/messages', 'POST', {
                        chat_id: currentChatId || 'general',
                        sender: currentUser,
                        text: '📞 Звонок ' + target + (isVideo ? ' (видео)' : ''),
                        type: 'text'
                    });
                })
                .catch(() => alert('Ошибка доступа к медиа'));
        }

        function endCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (currentCall) currentCall.close();
            currentCall = null;
            localStream = null;
            callModal.classList.remove('active');
            remoteVideo.srcObject = null;
            localVideo.srcObject = null;
            isMuted = false;
            muteBtn.innerHTML = '<i class="fas fa-microphone"></i>';
            muteBtn.classList.remove('muted');
        }

        // ===== CONTACTS & GROUPS =====
        async function addContact() {
            const name = prompt('Введите ник для добавления:');
            if (!name) return;
            if (!allUsers.includes(name)) { alert('Пользователь не найден'); return; }
            if (contacts.includes(name)) { alert('Уже в контактах'); return; }
            const result = await apiRequest('/contacts', 'POST', { user_id: currentUser, contact_id: name });
            if (!result.error) {
                contacts.push(name);
                const chatId = 'dm_' + [currentUser, name].sort().join('_');
                if (!chats.find(c => c.id === chatId)) {
                    const newChat = await apiRequest('/chats', 'POST', {
                        name: name,
                        type: 'dm',
                        members: [currentUser, name],
                        created_by: currentUser
                    });
                    if (!newChat.error) {
                        chats.push(newChat.chat);
                        renderChatList();
                    }
                }
                alert('➕ ' + name + ' добавлен в контакты');
            }
        }

        async function createGroup() {
            const name = prompt('Название группы:');
            if (!name) return;
            selectContacts('Выберите участников группы', async (selected) => {
                if (!selected.includes(currentUser)) selected.push(currentUser);
                const result = await apiRequest('/chats', 'POST', {
                    name: name,
                    type: 'group',
                    members: selected,
                    created_by: currentUser
                });
                if (!result.error) {
                    chats.push(result.chat);
                    renderChatList();
                    openChat(result.chat.id);
                }
            });
        }

        async function addToGroup() {
            if (!currentChatId) return;
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat || chat.type !== 'group') { alert('Это не группа'); return; }
            const currentMembers = chat.members || [];
            selectContacts('Добавить участников', async (selected) => {
                const newMembers = [...currentMembers];
                let added = 0;
                selected.forEach(name => {
                    if (!newMembers.includes(name)) { newMembers.push(name); added++; }
                });
                if (added === 0) { alert('Нет новых участников'); return; }
                chat.members = newMembers;
                await apiRequest('/chat_members', 'POST', { chat_id: currentChatId, members: selected });
                chatMembers.textContent = newMembers.length + ' участников';
                await apiRequest('/messages', 'POST', {
                    chat_id: currentChatId,
                    sender: 'system',
                    text: '➕ Добавлены: ' + selected.join(', '),
                    type: 'text'
                });
                renderChatList();
                openChat(currentChatId);
            });
        }

        // ===== MODAL =====
        function selectContacts(title, callback) {
            modalTitle.textContent = title;
            modalList.innerHTML = '';
            let selected = [];
            const available = allUsers.filter(u => u !== currentUser);
            if (available.length === 0) {
                modalList.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-secondary);">Нет пользователей</div>';
                modalConfirmBtn.disabled = true;
            } else {
                modalConfirmBtn.disabled = false;
                available.forEach(name => {
                    const div = document.createElement('div');
                    div.className = 'modal-item';
                    const color = '#3d8a7a';
                    div.innerHTML = `
                        <div class="avatar" style="background:${color}">${name[0].toUpperCase()}</div>
                        <span class="name">${name}</span>
                        <span class="check" style="display:none;"><i class="fas fa-check-circle"></i></span>
                    `;
                    div.addEventListener('click', () => {
                        const idx = selected.indexOf(name);
                        if (idx > -1) {
                            selected.splice(idx, 1);
                            div.querySelector('.check').style.display = 'none';
                        } else {
                            selected.push(name);
                            div.querySelector('.check').style.display = 'block';
                        }
                    });
                    modalList.appendChild(div);
                });
            }
            modalOverlay.classList.add('active');
            modalResolve = (confirmed) => {
                modalOverlay.classList.remove('active');
                if (confirmed && selected.length > 0) callback(selected);
                modalResolve = null;
            };
            modalConfirmBtn.onclick = () => {
                if (selected.length === 0) { alert('Выберите хотя бы одного участника'); return; }
                if (modalResolve) modalResolve(true);
            };
            modalCancelBtn.onclick = () => { if (modalResolve) modalResolve(false); };
            modalOverlay.onclick = (e) => { if (e.target === modalOverlay && modalResolve) modalResolve(false); };
        }

        // ===== RESPONSIVE =====
        function setupResponsive() {
            backToListBtn.addEventListener('click', () => rightPanel.classList.remove('active-mobile'));
            window.addEventListener('resize', () => {
                if (window.innerWidth > 640) rightPanel.classList.remove('active-mobile');
            });
        }

        // ===== LOGOUT =====
        function logout() {
            if (peer) peer.destroy();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            currentUser = null;
            mainLayout.classList.remove('active');
            authScreen.style.display = 'flex';
            messagesDiv.innerHTML = '';
            chatList.innerHTML = '';
            if (callModal.classList.contains('active')) callModal.classList.remove('active');
        }

        // ===== EVENTS =====
        authBtn.addEventListener('click', authUser);
        toggleAuth.addEventListener('click', () => {
            isRegister = !isRegister;
            authBtn.textContent = isRegister ? 'Создать аккаунт' : 'Войти';
            toggleAuth.textContent = isRegister ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Создать';
        });
        sendBtn.addEventListener('click', sendText);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendText(); });
        logoutBtn.addEventListener('click', logout);
        addContactBtn.addEventListener('click', addContact);
        createGroupBtn.addEventListener('click', createGroup);
        addToGroupBtn.addEventListener('click', addToGroup);
        voiceCallBtn.addEventListener('click', () => startCall(false));
        videoCallBtn.addEventListener('click', () => startCall(true));
        hangupBtn.addEventListener('click', endCall);
        muteBtn.addEventListener('click', () => {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
                muteBtn.innerHTML = isMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
                muteBtn.classList.toggle('muted');
            }
        });
        voiceMsgBtn.addEventListener('click', startVoiceRecording);
        circleBtn.addEventListener('click', startCircleRecording);
        attachBtn.addEventListener('click', () => {
            if (!currentChatId) return;
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = async (ev) => {
                        await apiRequest('/messages', 'POST', {
                            chat_id: currentChatId,
                            sender: currentUser,
                            text: '📎 ' + file.name,
                            type: 'file',
                            extra: ev.target.result
                        });
                        openChat(currentChatId);
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        });

        // ===== INIT =====
        window.addEventListener('DOMContentLoaded', () => {
            loginInput.value = 'Аргум';
            passInput.value = '123';
            if (Notification.permission === 'default') Notification.requestPermission();
        });

        console.log('⚔️ ClanChat v5.0 — с бэкендом на Render + Supabase');
        console.log('🌐 API URL:', API_URL);
    })();
</script>
</body>
</html>
