<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анонимный Чат</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .modal {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .hidden { display: none; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
    }
    button, .btn-link {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }
    button:hover, .btn-link:hover { background: #0369a1; }
    .code-inputs {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 16px 0;
    }
    .code-inputs input {
      width: 50px;
      height: 50px;
      text-align: center;
      font-size: 20px;
      margin: 0;
    }
    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div id="authModal" class="modal">
    <!-- ШАГ 1: Ввод Ника и Номера -->
    <div id="step1">
      <h2>Авторизация</h2>
      <input type="text" id="nickInput" placeholder="Ваш Никнейм">
      <input type="tel" id="phoneInput" placeholder="Номер телефона (+7, +375, +86)">
      <div class="hint">Поддерживаются: РФ/КЗ (+7), Беларусь (+375), Китай (+86)</div>
      <button onclick="requestCode()">Далее</button>
    </div>

    <!-- ШАГ 2: Переход в Бота и ввод Кода -->
    <div id="step2" class="hidden">
      <h2>Подтверждение</h2>
      <p style="font-size:14px; color:#cbd5e1;">Перейдите в бота, нажмите START и введите полученный код ниже:</p>
      
      <a id="tgBotBtn" class="btn-link" target="_blank">Открыть Бота и получить код</a>

      <div class="code-inputs">
        <input type="text" id="c1" maxlength="1" oninput="moveFocus(this, 'c2')">
        <input type="text" id="c2" maxlength="1" oninput="moveFocus(this, 'c3')">
        <input type="text" id="c3" maxlength="1" oninput="moveFocus(this, 'c4')">
        <input type="text" id="c4" maxlength="1">
      </div>

      <button onclick="verifyCode()">Войти в Чат</button>
    </div>
  </div>

  <div id="chatApp" class="hidden">
    <h2>Чат успешно запущен!</h2>
    <p id="userInfo"></p>
  </div>

  <script>
    // ⚠️ Убедись, что тут указан ТВОЙ ТЕКУЩИЙ NGROK АДРЕС:
    const API_URL = "https://uncolored-enunciate-dial.ngrok-free.dev/api";
    let currentFormattedPhone = "";

    function moveFocus(current, nextId) {
      if (current.value.length >= 1) {
        document.getElementById(nextId).focus();
      }
    }

    // Авто-вход по IP
    async function checkAutoLogin() {
      try {
        const res = await fetch(`${API_URL}/auto-login`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const data = await res.json();
        if (data.status === 'ok') {
          setUserProfile(data.user);
        }
      } catch (err) {
        console.log("Авто-вход не прошёл:", err);
      }
    }

    async function requestCode() {
      const nickname = document.getElementById('nickInput').value.trim();
      const phone = document.getElementById('phoneInput').value.trim();

      if (!nickname || !phone) return alert('Заполните все поля!');

      try {
        const res = await fetch(`${API_URL}/request-code`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({ phone, nickname })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.detail);

        currentFormattedPhone = data.phone;
        document.getElementById('tgBotBtn').href = data.bot_link;
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');

      } catch (err) {
        alert('Ошибка: ' + err.message);
      }
    }

    async function verifyCode() {
      const nickname = document.getElementById('nickInput').value.trim();
      const phone = currentFormattedPhone || document.getElementById('phoneInput').value.trim();
      const code = document.getElementById('c1').value + document.getElementById('c2').value + document.getElementById('c3').value + document.getElementById('c4').value;

      if (code.length < 4) return alert('Введите 4-значный код!');

      try {
        const res = await fetch(`${API_URL}/verify-code`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({ phone, nickname, code })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.detail);

        setUserProfile(data.user);

      } catch (err) {
        alert('Ошибка: ' + err.message);
      }
    }

    function setUserProfile(user) {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('chatApp').classList.remove('hidden');
      document.getElementById('userInfo').innerText = `Вы вошли как: ${user.name} (${user.phone})`;
    }

    window.onload = checkAutoLogin;
  </script>
</body>
</html>
