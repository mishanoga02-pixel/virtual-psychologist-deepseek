<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .hidden { display: none !important; }

    /* Окна авторизации */
    .auth-overlay { position: fixed; inset: 0; background: #0f172a; z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .auth-box { background: #1e293b; width: 100%; max-width: 360px; padding: 32px 24px; border-radius: 20px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
    .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .auth-subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.4; }
    
    .select-country { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 14px; outline: none; margin-bottom: 12px; cursor: pointer; }
    .input-field { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 15px; outline: none; transition: 0.2s; margin-bottom: 12px; }
    .input-field:focus { border-color: #38bdf8; }

    .btn-primary { width: 100%; padding: 14px; background: #8774e1; border: none; border-radius: 10px; color: white; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
    .btn-primary:hover { background: #7360cd; }
    .btn-link { background: transparent; color: #38bdf8; border: none; margin-top: 12px; font-size: 13px; cursor: pointer; }

    .code-inputs { display: flex; justify-content: center; gap: 8px; margin: 20px 0; }
    .code-inputs input { width: 48px; height: 54px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; text-align: center; font-size: 22px; font-weight: bold; }
    .code-inputs input:focus { border-color: #8774e1; outline: none; }

    .account-item { background: #0f172a; border: 1px solid #334155; padding: 14px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-align: left; }
    .account-item:hover { border-color: #8774e1; }

    /* Главный Мессенджер (Интерфейс Telegram Web) */
    .app-main { width: 100vw; height: 100vh; display: flex; background: #0f172a; overflow: hidden; }
    
    /* Список чатов */
    .sidebar { width: 340px; background: #17212b; border-right: 1px solid #0e1621; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0e1621; background: #17212b; }
    .sidebar-header h3 { font-size: 16px; color: #fff; }
    .user-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); transition: 0.15s; }
    .chat-item:hover, .chat-item.active { background: #2b5278; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: #8774e1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #fff; flex-shrink: 0; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 2px; }
    .chat-sub { font-size: 12px; color: #7f91a4; }

    /* Окно переписки */
    .chat-window { flex: 1; display: flex; flex-direction: column; background: #0e1621; position: relative; }
    .chat-header { height: 60px; padding: 0 16px; background: #17212b; border-bottom: 1px solid #0e1621; display: flex; align-items: center; gap: 12px; }
    .back-btn { display: none; background: none; border: none; color: #8774e1; font-size: 20px; cursor: pointer; padding: 4px; }
    
    .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#1e2c3a 1px, transparent 0); background-size: 20px 20px; }
    .msg-bubble { max-width: 65%; padding: 8px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
    .msg-bubble.my { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 2px; color: #fff; }
    .msg-bubble.their { background: #182533; align-self: flex-start; border-bottom-left-radius: 2px; color: #fff; }
    .msg-time { font-size: 10px; color: rgba(255,255,255,0.5); text-align: right; margin-top: 4px; }

    .input-bar { padding: 12px 16px; background: #17212b; display: flex; gap: 10px; align-items: center; border-top: 1px solid #0e1621; }
    .msg-input { flex: 1; background: #0e1621; border: none; padding: 12px 16px; border-radius: 20px; color: #fff; font-size: 14px; outline: none; }
    .send-btn { background: #8774e1; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }

    /* МОБИЛЬНАЯ АДАПТАЦИЯ (ТЕЛЕФОН) */
    @media (max-width: 768px) {
      .sidebar { width: 100vw; }
      .chat-window { width: 100vw; position: absolute; inset: 0; transform: translateX(100%); transition: transform 0.25s ease-in-out; }
      .chat-window.open { transform: translateX(0); }
      .back-btn { display: block; }
    }
  </style>
</head>
<body>

  <!-- АВТОРИЗАЦИЯ -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-box">
      
      <!-- Шаг 1: Ввод номера -->
      <div id="stepPhone">
        <div class="auth-title">Ваш телефон</div>
        <div class="auth-subtitle">Выберите страну и введите ваш номер для входа</div>
        
        <select id="countrySelect" class="select-country" onchange="onCountryChange()">
          <option value="+7">🇷🇺 / 🇰🇿 Россия / Казахстан (+7)</option>
          <option value="+375">🇧🇾 Беларусь (+375)</option>
          <option value="+86">🇨🇳 Китай (+86)</option>
        </select>

        <input type="tel" id="phoneInput" class="input-field" placeholder="+7 999 000 00 00" oninput="formatPhoneInput(this)">
        <button class="btn-primary" onclick="submitPhone()">Далее</button>
      </div>

      <!-- Шаг 2: Выбор существующего аккаунта -->
      <div id="stepAccounts" class="hidden">
        <div class="auth-title">Аккаунты</div>
        <div class="auth-subtitle" id="accPhoneTitle"></div>
        <div id="accountsContainer"></div>
        <button id="addAccBtn" class="btn-primary" style="background:#334155; margin-top:8px;" onclick="goToNewAccount()">+ Создать новый аккаунт</button>
      </div>

      <!-- Шаг 3: Ввод никнейма -->
      <div id="stepNick" class="hidden">
        <div class="auth-title">Имя аккаунта</div>
        <div class="auth-subtitle">Укажите никнейм для регистрации</div>
        <input type="text" id="nickInput" class="input-field" placeholder="Ваш никнейм">
        <button class="btn-primary" onclick="submitNick()">Продолжить</button>
        <button class="btn-link" onclick="backToAccounts()">Назад</button>
      </div>

      <!-- Шаг 4: Код подтверждения -->
      <div id="stepCode" class="hidden">
        <div class="auth-title">Подтверждение</div>
        <div class="auth-subtitle">Перейдите в Telegram-бота, нажмите <b>START</b> и введите код:</div>
        
        <a id="tgBotLink" class="btn-primary" style="margin-bottom:12px;" target="_blank">Открыть Telegram Бота</a>

        <div class="code-inputs">
          <input type="text" id="c1" maxlength="1" oninput="moveFocus(this, 'c2')">
          <input type="text" id="c2" maxlength="1" oninput="moveFocus(this, 'c3')">
          <input type="text" id="c3" maxlength="1" oninput="moveFocus(this, 'c4')">
          <input type="text" id="c4" maxlength="1">
        </div>

        <button class="btn-primary" onclick="verifyCode()">Войти</button>
      </div>

    </div>
  </div>

  <!-- МЕССЕНДЖЕР -->
  <div class="app-main">
    
    <!-- СПИСОК ЧАТОВ -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div>
          <h3 id="myNickHeader">Чаты</h3>
          <span id="myPeerHeader" style="font-size:11px; color:#38bdf8;"></span>
        </div>
        <button style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:12px;" onclick="logout()">Выйти</button>
      </div>

      <div class="user-list" id="usersList">
        <!-- Список чатов загружается сюда -->
      </div>
    </div>

    <!-- ОКНО ЧАТА -->
    <div id="chatWindow" class="chat-window">
      <div class="chat-header">
        <button class="back-btn" onclick="closeMobileChat()">←</button>
        <div class="avatar" id="chatAvatar">?</div>
        <div>
          <div class="chat-name" id="chatTitle">Выберите чат</div>
          <div class="chat-sub" id="chatSubTitle">чтобы начать общение</div>
        </div>
      </div>

      <div class="messages-area" id="messagesArea">
        <div style="text-align:center; color:#7f91a4; margin-top:auto; margin-bottom:auto;">
          Выберите собеседника из списка слева
        </div>
      </div>

      <div class="input-bar">
        <input type="text" id="msgInput" class="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">➔</button>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://uncolored-enunciate-dial.ngrok-free.dev/api";

    let currentUser = null;
    let selectedPhone = "";
    let selectedNick = "";
    let activePeerId = null;

    // --- Автопробелы и форматам телефонов ---
    function onCountryChange() {
      const code = document.getElementById('countrySelect').value;
      const input = document.getElementById('phoneInput');
      input.value = code + ' ';
    }

    function formatPhoneInput(input) {
      let code = document.getElementById('countrySelect').value;
      let val = input.value.replace(/\D/g, ''); // Только цифры

      if (code === '+7') {
        if (!val.startsWith('7')) val = '7' + val;
        let formatted = '+7';
        if (val.length > 1) formatted += ' ' + val.substring(1, 4);
        if (val.length > 4) formatted += ' ' + val.substring(4, 7);
        if (val.length > 7) formatted += ' ' + val.substring(7, 9);
        if (val.length > 9) formatted += ' ' + val.substring(9, 11);
        input.value = formatted;
      } else if (code === '+375') {
        if (!val.startsWith('375')) val = '375' + val;
        let formatted = '+375';
        if (val.length > 3) formatted += ' ' + val.substring(3, 5);
        if (val.length > 5) formatted += ' ' + val.substring(5, 8);
        if (val.length > 8) formatted += ' ' + val.substring(8, 10);
        if (val.length > 10) formatted += ' ' + val.substring(10, 12);
        input.value = formatted;
      } else if (code === '+86') {
        if (!val.startsWith('86')) val = '86' + val;
        let formatted = '+86';
        if (val.length > 2) formatted += ' ' + val.substring(2, 5);
        if (val.length > 5) formatted += ' ' + val.substring(5, 9);
        if (val.length > 9) formatted += ' ' + val.substring(9, 13);
        input.value = formatted;
      }
    }

    function moveFocus(current, nextId) {
      if (current.value.length >= 1) {
        document.getElementById(nextId).focus();
      }
    }

    async function checkAutoLogin() {
      onCountryChange();
      try {
        const res = await fetch(`${API_URL}/auto-login`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const data = await res.json();
        if (data.status === 'ok') {
          initUserSession(data.user);
        }
      } catch (err) {}
    }

    async function submitPhone() {
      const rawPhone = document.getElementById('phoneInput').value;
      if (rawPhone.length < 8) return alert('Введите корректный номер телефона!');

      try {
        const res = await fetch(`${API_URL}/check-phone`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ phone: rawPhone })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        selectedPhone = data.phone;

        if (data.accounts && data.accounts.length > 0) {
          showAccountsList(data.accounts);
        } else {
          goToNewAccount();
        }
      } catch (err) {
        alert(err.message);
      }
    }

    function showAccountsList(accounts) {
      document.getElementById('stepPhone').classList.add('hidden');
      document.getElementById('stepAccounts').classList.remove('hidden');
      document.getElementById('accPhoneTitle').innerText = selectedPhone;

      const container = document.getElementById('accountsContainer');
      container.innerHTML = '';

      accounts.forEach(acc => {
        const item = document.createElement('div');
        item.className = 'account-item';
        item.innerHTML = `<div><b>${acc.name}</b><br><span style="font-size:11px; color:#7f91a4;">ID: ${acc.peer_id}</span></div><span style="color:#8774e1; font-weight:bold;">Войти →</span>`;
        item.onclick = () => {
          selectedNick = acc.name;
          requestCode();
        };
        container.appendChild(item);
      });

      const addBtn = document.getElementById('addAccBtn');
      if (accounts.length >= 2) {
        addBtn.classList.add('hidden');
      } else {
        addBtn.classList.remove('hidden');
      }
    }

    function goToNewAccount() {
      document.getElementById('stepPhone').classList.add('hidden');
      document.getElementById('stepAccounts').classList.add('hidden');
      document.getElementById('stepNick').classList.remove('hidden');
    }

    function backToAccounts() {
      document.getElementById('stepNick').classList.add('hidden');
      document.getElementById('stepAccounts').classList.remove('hidden');
    }

    async function submitNick() {
      selectedNick = document.getElementById('nickInput').value.trim();
      if (!selectedNick) return alert('Введите никнейм!');
      requestCode();
    }

    async function requestCode() {
      try {
        const res = await fetch(`${API_URL}/request-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ phone: selectedPhone, nickname: selectedNick })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        document.getElementById('tgBotLink').href = data.bot_link;
        document.getElementById('stepAccounts').classList.add('hidden');
        document.getElementById('stepNick').classList.add('hidden');
        document.getElementById('stepCode').classList.remove('hidden');
      } catch (err) {
        alert(err.message);
      }
    }

    async function verifyCode() {
      const code = document.getElementById('c1').value + document.getElementById('c2').value + document.getElementById('c3').value + document.getElementById('c4').value;
      if (code.length < 4) return alert('Введите 4-значный код!');

      try {
        const res = await fetch(`${API_URL}/verify-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify({ phone: selectedPhone, nickname: selectedNick, code })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        initUserSession(data.user);
      } catch (err) {
        alert(err.message);
      }
    }

    function initUserSession(user) {
      currentUser = user;
      document.getElementById('authOverlay').classList.add('hidden');
      document.getElementById('myNickHeader').innerText = user.name;
      document.getElementById('myPeerHeader').innerText = `ID: ${user.peer_id}`;

      loadUsers();
      setInterval(loadUsers, 4000);
      setInterval(loadMessages, 1500);
    }

    async function loadUsers() {
      try {
        const res = await fetch(`${API_URL}/users`);
        const data = await res.json();
        const list = document.getElementById('usersList');
        list.innerHTML = '';

        data.users.forEach(u => {
          if (currentUser && u.peer_id === currentUser.peer_id) return;

          const item = document.createElement('div');
          item.className = `chat-item ${activePeerId === u.peer_id ? 'active' : ''}`;
          item.innerHTML = `
            <div class="avatar">${u.name.charAt(0).toUpperCase()}</div>
            <div class="chat-info">
              <div class="chat-name">${u.name}</div>
              <div class="chat-sub">ID: ${u.peer_id}</div>
            </div>
          `;
          item.onclick = () => openChat(u);
          list.appendChild(item);
        });
      } catch (err) {}
    }

    function openChat(user) {
      activePeerId = user.peer_id;
      document.getElementById('chatTitle').innerText = user.name;
      document.getElementById('chatSubTitle').innerText = `ID: ${user.peer_id}`;
      document.getElementById('chatAvatar').innerText = user.name.charAt(0).toUpperCase();

      // Мобильный сдвиг экрана
      document.getElementById('chatWindow').classList.add('open');

      loadUsers();
      loadMessages();
    }

    function closeMobileChat() {
      document.getElementById('chatWindow').classList.remove('open');
    }

    async function sendMessage() {
      const text = document.getElementById('msgInput').value.trim();
      if (!activePeerId || !text) return;

      try {
        await fetch(`${API_URL}/save-message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sender_id: currentUser.peer_id,
            receiver_id: activePeerId,
            msg_type: 'text',
            content: text
          })
        });

        document.getElementById('msgInput').value = '';
        loadMessages();
      } catch (err) {}
    }

    async function loadMessages() {
      if (!activePeerId || !currentUser) return;

      try {
        const res = await fetch(`${API_URL}/get-messages/${currentUser.peer_id}/${activePeerId}`);
        const data = await res.json();

        const area = document.getElementById('messagesArea');
        area.innerHTML = '';

        data.messages.forEach(m => {
          const bubble = document.createElement('div');
          bubble.className = `msg-bubble ${m.sender_id === currentUser.peer_id ? 'my' : 'their'}`;
          
          const date = new Date(m.timestamp);
          const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          bubble.innerHTML = `${m.content}<div class="msg-time">${timeStr}</div>`;
          area.appendChild(bubble);
        });

        area.scrollTop = area.scrollHeight;
      } catch (err) {}
    }

    async function logout() {
      await fetch(`${API_URL}/logout`, { method: 'POST' });
      location.reload();
    }

    window.onload = checkAutoLogin;
  </script>
</body>
</html>
